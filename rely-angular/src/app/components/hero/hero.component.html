<section id="inicio" class="relative h-screen flex items-center justify-center overflow-hidden bg-gray-900">
  <div class="absolute inset-0 z-0">
    <img
      src="/photo_2026-03-24_07-09-28_(2).jpg"
      alt="RELY Truck"
      class="w-full h-full object-cover opacity-90 scale-105 transform"
    />
    <!-- Overlays mucho más suaves - solo lo necesario para legibilidad -->
    <div class="absolute inset-0 bg-gradient-to-r from-gray-900/60 via-gray-900/30 to-transparent"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-gray-900/80 via-transparent to-transparent"></div>
  </div>

  <!-- Elementos decorativos sutiles -->
  <div class="absolute top-20 right-20 w-72 h-72 bg-orange-600/10 rounded-full blur-3xl"></div>

  <div class="relative z-10 text-center px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto">
    <div class="mb-6">
      <span class="text-orange-400 text-sm font-semibold tracking-widest uppercase bg-white/10 backdrop-blur-sm px-5 py-2 rounded-full border border-white/20">
        Nueva Generación 2025
      </span>
    </div>
    
    <h1 class="text-7xl sm:text-8xl md:text-9xl font-bold text-white mb-8 tracking-tighter leading-none drop-shadow-lg">
      RELY
    </h1>
    
    <p class="text-xl sm:text-2xl md:text-3xl text-gray-100 mb-12 font-light max-w-3xl mx-auto leading-relaxed drop-shadow-md">
      Domina cada terreno con potencia y elegancia sin precedentes
    </p>
    
    <div class="flex flex-col sm:flex-row gap-5 justify-center items-center">
      <button
        (click)="isPurchaseOpen = true"
        class="group bg-orange-600 text-white px-10 py-5 rounded-full text-lg font-semibold hover:bg-orange-500 transition-all transform hover:scale-105 shadow-xl shadow-orange-600/30 relative overflow-hidden">
        <span class="relative z-10">Reservar Ahora</span>
        <div class="absolute inset-0 bg-white/20 transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-700"></div>
      </button>
      
      <a href="#caracteristicas" 
         class="group bg-white/15 backdrop-blur-sm text-white px-10 py-5 rounded-full text-lg font-semibold hover:bg-white/25 transition-all border-2 border-white/30 flex items-center gap-2 shadow-lg">
        Explorar
        <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- Indicador de scroll más visible -->
  <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-10">
    <div class="flex flex-col items-center gap-2">
      <span class="text-white/80 text-xs tracking-widest uppercase font-medium">Descubrir</span>
      <div class="animate-bounce bg-white/10 backdrop-blur-sm rounded-full p-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>
  </div>
</section>

<app-purchase [isOpen]="isPurchaseOpen" (closeModal)="isPurchaseOpen = false"></app-purchase>
